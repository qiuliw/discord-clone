services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATABASE_PATH: /data/app.db
      SESSION_SECRET_PATH: /data/.session_secret
    volumes:
      - api-data:/data

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      API_PROXY_URL: http://api:8080
    depends_on:
      - api

volumes:
  api-data:
