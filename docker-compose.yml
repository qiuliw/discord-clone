name: discord-clone

services:
  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATABASE_PATH: /data/app.db
      JWT_SECRET_PATH: /data/.jwt_secret
    volumes:
      - user-data:/data

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      API_PROXY_URL: http://user:8080
    depends_on:
      - user

volumes:
  user-data:
